name: Build FTP TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate assets (icons, banner, keystore)
        run: |
          pip install --quiet pillow
          bash ci/prepare.sh

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: App version
        run: echo "APP_VERSION=1.0.$(( ${{ github.run_number }} - 1 ))" >> "$GITHUB_ENV"

      - name: Which devices to build for (commit trailer "Target: phone" or "Target: tv", otherwise both)
        run: |
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          phone=0; tv=0
          for c in $(git rev-list --no-merges $range); do
            t=$(git log -1 --format=%B "$c" | grep -i '^Target:' | tail -1 | cut -d: -f2 | tr -d ' ' | tr 'A-Z' 'a-z')
            case "$t" in
              phone) phone=1 ;;
              tv) tv=1 ;;
              *) phone=1; tv=1 ;;
            esac
          done
          if [ $phone = 0 ] && [ $tv = 0 ]; then phone=1; tv=1; fi
          echo "BUILD_PHONE=$phone" >> "$GITHUB_ENV"
          echo "BUILD_TV=$tv" >> "$GITHUB_ENV"
          if [ $phone = 1 ] && [ $tv = 1 ]; then echo "TARGET_LABEL=" >> "$GITHUB_ENV"
          elif [ $tv = 1 ]; then echo "TARGET_LABEL= (TV)" >> "$GITHUB_ENV"
          else echo "TARGET_LABEL= (phone)" >> "$GITHUB_ENV"; fi

      - name: Build release APKs
        run: gradle assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          if [ "$BUILD_TV" = 1 ]; then cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/FTPTV-v${{ env.APP_VERSION }}-armv7.apk; fi
          if [ "$BUILD_PHONE" = 1 ]; then cp app/build/outputs/apk/release/app-arm64-v8a-release.apk out/FTPTV-v${{ env.APP_VERSION }}-arm64.apk; fi
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: FTPTV-apk
          path: out/*.apk

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          {
            git log --no-merges --pretty='- %s' $range | grep -v '^- *$' | head -40
            echo
            if [ "$BUILD_TV" = 1 ]; then echo "Mi TV Stick / most Android TV boxes → **armv7** APK."; fi
            if [ "$BUILD_PHONE" = 1 ]; then echo "Newer 64-bit phones → arm64 APK."; fi
          } > notes.md
          cat notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: FTP TV v${{ env.APP_VERSION }}${{ env.TARGET_LABEL }}
          body_path: notes.md
          files: out/*.apk
